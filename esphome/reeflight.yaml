select:
  - platform: template
    id: lunar_sync
    name: Lunar Sync
    icon: mdi:sync
    entity_category: config
    options: ["Day 1 start", "Location"]
    initial_option: "Location"
    optimistic: true
    restore_value: true
    on_value:
      - lambda: |-
          // Picking "Day 1 start" (after boot) restarts the cycle at day 1.
          if (id(booted) && i == 0) id(lunar_epoch) = 0;
          id(lunar_calc).execute();
  - platform: template
    id: lunar_hours
    name: Lunar Hours
    icon: mdi:clock-outline
    entity_category: config
    options: ["Moon up", "Time window", "Duration"]
    initial_option: "Moon up"
    optimistic: true
    restore_value: true
    on_value:
      - lambda: 'id(lunar_calc).execute();'

datetime:
  - platform: template
    id: lunar_start
    name: Lunar Start
    type: time
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: "20:30:00"
    on_value:
      - lambda: 'id(lunar_calc).execute();'
  - platform: template
    id: lunar_end
    name: Lunar End
    type: time
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: "04:30:00"
    on_value:
      - lambda: 'id(lunar_calc).execute();'

switch:
  - platform: template
    id: manual
    name: Manual Override
    icon: mdi:tune-vertical
    optimistic: true
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - lambda: |-
          id(manual_since) = millis();
          for (int k = 0; k < 4; k++) {
            const float cur = id(level_cache)[k];
            if (id(manual_levels)[k] < 0) id(manual_levels)[k] = cur;
          }
          id(apply_curve).execute();
    on_turn_off:
      - lambda: |-
          for (int k = 0; k < 4; k++) id(manual_levels)[k] = -1;
          id(apply_curve).execute();
  - platform: template
    id: lunar
    name: Lunar Cycle
    icon: mdi:moon-waxing-crescent
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: |-
          // Turning lunar on starts the Day 1 cycle (a restore at boot keeps the old start).
          if (id(booted)) id(lunar_epoch) = 0;
          id(lunar_calc).execute();
    on_turn_off:
      - lambda: 'id(apply_curve).execute();'
  - platform: template
    id: acclimation
    name: Acclimation
    icon: mdi:chart-line-variant
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: |-
          // Turning it on starts at day 1 today (a restore at boot keeps the old start).
          if (id(booted)) id(accl_start_day) = 0;
          id(accl_calc).execute();
          id(apply_curve).execute();
    on_turn_off:
      - lambda: |-
          id(accl_start_day) = 0;
          id(accl_calc).execute();
          id(apply_curve).execute();
  - platform: template
    id: power
    name: Power
    icon: mdi:lightbulb-group
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - lambda: 'id(apply_curve).execute();'
    on_turn_off:
      - lambda: 'id(apply_curve).execute();'

