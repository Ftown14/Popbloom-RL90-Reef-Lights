# Copy this file to secrets.yaml (in this same folder) and fill in your own values.
# secrets.yaml is listed in .gitignore, so Git never uploads it. Never share it.
# Full explanation of each value: docs/flashing.md, part C.

wifi_ssid: "YourWiFiName"            # your 2.4 GHz WiFi network name (case-sensitive)
wifi_password: "YourWiFiPassword"    # its password
ap_password: "rescue-hotspot-pass"   # password for the light's rescue hotspot, 8+ characters (not your WiFi password)
api_key: "paste the 44-character key you generated here"   # HA encryption key, ends in =
